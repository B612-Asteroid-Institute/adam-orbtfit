[project]
name = "adam-orbfit"
dynamic = ["version"]
description = "ADAM wrapper for MPC Orbfit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]

keywords = ["astronomy", "orbital mechanics", "orbit determination"]

dependencies = [
  "adam_core>=0.5.5",
  "numpy>=2.0.0",
  "pyarrow>=13.0.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.urls]
"Documentation" = "https://github.com/B612-Asteroid-Institute/adam-orbfit#README.md"
"Issues" = "https://github.com/B612-Asteroid-Institute/adam-orbfit/issues"
"Source" = "https://github.com/B612-Asteroid-Institute/adam-orbfit"


[dependency-groups]
test = [
    "pytest-benchmark",
    "pytest-cov",
    "pytest-doctestplus",
    "pytest-mock",
    "pytest-xdist",
    "pytest",
    "isort",
    "mypy",
    "ruff",
    "black",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
norecursedirs = ["__pypackages__"]

[tool.ruff]
line-length = 110
target-version = "py311"
lint.ignore = []
exclude = ["build"]

[tool.pdm.build]
includes = ["src/adam_orbfit/"]
excludes = [
  "**/__pycache__/**",
  "**/*.py[cod]",
  "**/*.nbc",
  "**/*.nbi",
  "**/.DS_Store",
]

[tool.pdm.version]
source = "scm"
write_to = "adam_orbfit/_version.py"
write_template = "__version__ = '{}'"

[tool.pdm.scripts]
check = { composite = ["lint", "typecheck", "test"] }
format = { composite = ["black ./src/adam_orbfit", "isort ./src/adam_orbfit"] }
lint = { composite = [
  "ruff check ./src/adam_orbfit",
  "black --check ./src/adam_orbfit",
  "isort --check-only ./src/adam_orbfit",
] }
fix = "ruff check ./src/adam_orbfit --fix"
typecheck = "mypy --strict ./src/adam_orbfit"

test = "pytest --benchmark-skip -m 'not profile' {args}"
doctest = "pytest --doctest-plus --doctest-only"
benchmark = "pytest --benchmark-only {args}"
coverage = "pytest --benchmark-skip --cov=adam_orbfit --cov-report=xml -m 'not profile' {args}"
